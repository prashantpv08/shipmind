name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: web-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Static, unit, and production build checks
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 10.28.1
          run_install: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm security:audit
      - run: pnpm lint
      - run: pnpm architecture:check
      - run: pnpm contracts:check
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build

  legacy-boundary:
    name: Production legacy surface is default-deny
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 10.28.1
          run_install: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Install the browser used by the boundary test
        run: pnpm exec playwright install --with-deps chromium
      - name: Build the production web application
        run: pnpm build
      - name: Start the production server on loopback
        run: |
          pnpm start --hostname 127.0.0.1 > /tmp/axiom-web.log 2>&1 &
          for attempt in $(seq 1 60); do
            if curl --fail --silent --output /dev/null http://127.0.0.1:3000/account; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/axiom-web.log
          exit 1
      - name: Verify the production legacy boundary
        env:
          PLAYWRIGHT_BASE_URL: http://127.0.0.1:3000
        run: pnpm exec playwright test e2e/legacy-boundary.spec.ts
      - name: Upload browser evidence after failure
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: legacy-boundary-playwright-evidence
          path: |
            playwright-report/
            test-results/
            /tmp/axiom-web.log
          if-no-files-found: ignore
          retention-days: 7
